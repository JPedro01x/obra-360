name: obra360

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: obra360
      POSTGRES_USER: obra360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "obra360", "-d", "obra360"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/obra360
      SPRING_DATASOURCE_USERNAME: obra360
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?configure JWT_SECRET}
      OBRA360_SETUP_ENABLED: "false"
      APP_PUBLIC_URL: https://${APP_DOMAIN:?configure APP_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?configure APP_DOMAIN}
      OBRA360_STORAGE_DIRECTORY: /app/data/documentos
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SPRING_APPLICATION_JSON: '{"server":{"forward-headers-strategy":"native","tomcat":{"remoteip":{"internal-proxies":"172[.]30[.]86[.]2","protocol-header":"X-Forwarded-Proto"}}}}'
    volumes:
      - documents:/app/data
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  proxy:
    image: caddy:2.11-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?configure APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.30.86.2
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.86.0/24
  database:
    internal: true

volumes:
  postgres:
  documents:
  caddy_data:
  caddy_config:
