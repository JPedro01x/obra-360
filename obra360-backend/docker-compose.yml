version: '3.8'

services:
  # Banco de Dados Transacional (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: obra360-postgres
    environment:
      POSTGRES_DB: obra360_db
      POSTGRES_USER: obra360_user
      POSTGRES_PASSWORD: obra360_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obra360_user -d obra360_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco de Auditoria Imutável (MongoDB NoSQL)
  mongodb:
    image: mongo:6-jammy
    container_name: obra360-mongodb
    environment:
      MONGO_INITDB_DATABASE: obra360_audit
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Barramento de Eventos Assíncronos (Apache Kafka em Modo KRaft)
  kafka:
    image: bitnami/kafka:3.4.0
    container_name: obra360-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

volumes:
  postgres_data:
  mongo_data:
