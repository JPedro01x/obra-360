server:
  port: 8080

spring:
  application:
    name: obra360-backend

  datasource:
    url: jdbc:h2:mem:obra360_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  kafka:
    listener:
      auto-startup: false

obra360:
  setup:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
    expiration-ms: 86400000
