# Persistent local installation. Production uses the PostgreSQL configuration
# from application.yml with an explicit production profile.
spring:
  datasource:
    url: jdbc:h2:file:./data/obra360;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
obra360:
  setup:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
    expiration-ms: 3600000
