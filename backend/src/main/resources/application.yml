server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: obra360-backend-service
  
  # Database Configuration (H2 in-memory for dev, auto DDL)
  datasource:
    url: jdbc:h2:mem:obra360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Asynchronous Thread Execution Pool (@Async Configuration)
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100
        thread-name-prefix: Obra360-AsyncThread-

  # Messaging Configuration (RabbitMQ / EventBus PubSub)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

obra360:
  messaging:
    exchange-name: obra360.events.exchange
    queues:
      stock-events: obra360.queue.stock
      audit-events: obra360.queue.audit
      company-events: obra360.queue.company
