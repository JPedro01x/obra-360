server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: obra360-backend-service
  
  # Database Configuration (H2 in-memory for dev, auto DDL)
  datasource:
    url: jdbc:h2:mem:obra360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Asynchronous Thread Execution Pool (@Async Configuration)
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100
        thread-name-prefix: Obra360-AsyncThread-

# Spring Actuator Metrics & Health Check Endpoints
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always

  # Messaging Configuration (RabbitMQ / EventBus PubSub)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  # Apache Kafka Event Streaming Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: obra360-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

obra360:
  messaging:
    kafka-topic-stock: obra360.events.stock-min
    exchange-name: obra360.events.exchange
    queues:
      stock-events: obra360.queue.stock
      audit-events: obra360.queue.audit
      company-events: obra360.queue.company
