name: Obra 360 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repositório
      uses: actions/checkout@v4

    - name: Configurar Java 21 LTS (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Build & Run Unit Tests (Maven)
      run: |
        cd obra360-backend
        mvn clean test -B

    - name: Validação do Pacote JAR & PWA Assets
      run: |
        cd obra360-backend
        mvn package -DskipTests -B
        test -f target/obra360-backend-1.0.0-SNAPSHOT.jar
        echo "✅ JAR e PWA embarcado validados com sucesso!"
