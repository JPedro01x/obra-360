name: Obra360 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-image:
    name: Test production Compose, HTTPS and backup restoration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        messaging: [false, true]
    env:
      OBRA360_COMPOSE_MESSAGING: ${{ matrix.messaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise production services and restore into new volumes
        run: bash scripts/ci-production-smoke.sh

  backend-build-test:
    name: Backend Java 21 & Spring Boot Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Package and Run Backend Unit Tests
        working-directory: obra360-backend
        run: mvn clean verify --batch-mode

      - name: Set up Node for Java Dependency Audit
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject Java Dependencies with Known Advisories
        run: node scripts/audit-java-dependencies.mjs

      - name: Keep Dependency Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-audit
          path: test-results/java-dependencies-*.json
          if-no-files-found: ignore

  frontend-build-test:
    name: Frontend React 18, Vite & Playwright E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile and Build Vite Production Bundle
        run: npm run build

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npx playwright test

      - name: Verify Support Pagination and Messaging Panel
        run: npx playwright test --config playwright.atendimento.config.ts

      - name: Verify Backup and Restore
        run: npm run test:backup

      - name: Verify Protected Test Credentials
        run: node --test scripts/homologacao-credentials.test.mjs scripts/pilot-acceptance.test.mjs scripts/operations-local.test.mjs scripts/dependency-audit-policy.test.mjs scripts/kafka-autostart.test.mjs

      - name: Set up Java for Integrated Browser Journey
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Browser API Database Journey
        run: npm run test:integrated

      - name: Audit All User Profiles and Permissions
        run: npm run test:roles

      - name: Validate PostgreSQL Migrations and Workflows
        run: npm run test:postgres
