name: Obra360 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  production-image:
    name: Test production Compose, HTTPS and backup restoration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise production services and restore into new volumes
        run: bash scripts/ci-production-smoke.sh

  backend-build-test:
    name: Backend Java 21 & Spring Boot Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Backend Unit Tests
        working-directory: obra360-backend
        run: mvn clean test --batch-mode

  frontend-build-test:
    name: Frontend React 18, Vite & Playwright E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile and Build Vite Production Bundle
        run: npm run build

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npx playwright test

      - name: Verify Backup and Restore
        run: npm run test:backup

      - name: Verify Protected Test Credentials
        run: node --test scripts/homologacao-credentials.test.mjs scripts/pilot-acceptance.test.mjs scripts/operations-local.test.mjs

      - name: Set up Java for Integrated Browser Journey
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Browser API Database Journey
        run: npm run test:integrated

      - name: Audit All User Profiles and Permissions
        run: npm run test:roles

      - name: Validate PostgreSQL Migrations and Workflows
        run: npm run test:postgres
